name: Build and test

on:
  push:
    branches: [main, port-pressio4py-017]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / Python 3.10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install build and test tools
        run: python -m pip install --upgrade pip build pytest

      - name: Build wheel
        run: python -m build --wheel

      - name: Install wheel
        shell: bash
        run: python -m pip install dist/*.whl

      - name: Run compiled tests
        shell: bash
        run: |
          compiled_tests=$(find build -type d -name tests_compiled -print -quit)
          test -n "$compiled_tests"
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/$compiled_tests"

      - name: Run functional tests
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest \
            "$GITHUB_WORKSPACE/tests_functional_small" \
            "$GITHUB_WORKSPACE/tests_functional_medium"

      - name: Build source distribution
        run: python -m build --sdist

      - name: Verify source distribution installs
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.tar.gz
          cd "$RUNNER_TEMP"
          python -c "import pressio4py; print(pressio4py.__version__)"
